# Vitte language support for Geany
# Install to: ~/.config/geany/filedefs/filetypes.vitte.conf

[styling=C]
# Reuse Geany's active C lexer colors so both light and dark color schemes work.

# ============================================================================
# Keywords
# ============================================================================

[keywords]

# Canonical Vitte keywords.
primary=space use export const static type opaque form pick trait impl proc extern intrinsic macro test pub async unsafe comptime where requires ensures let mut set return give break continue defer assert if else while loop for in match asm ref move await not and or self as

# Declarations and literals.
secondary=space use export const static type opaque form pick trait impl proc extern intrinsic macro test true false null

docComment=TODO FIXME BUG HACK NOTE XXX

# Built-in types.
secondary=void never unit bool char rune str string bytes cstr int i8 i16 i32 i64 i128 isize u8 u16 u32 u64 u128 usize intptr uintptr f16 f32 f64 f128 c_char c_int c_uint c_long c_ulong c_void

# ============================================================================
# File settings
# ============================================================================

[settings]

name=Vitte
extension=vit
mime_type=text/x-vitte

wordchars=_abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789

lexer_filetype=C
tag_parser=C
symbol_list_sort_mode=1

# Terminal diagnostics locate the source on a separate arrow line.

comment_single=//
comment_open=/*
comment_close=*/
comment_use_indent=true

# ============================================================================
# Indentation
# ============================================================================

[indentation]

width=4
type=0
hard_tab_width=8
detect_indent=false
detect_indent_width=false
indent_mode=2

# ============================================================================
# Build menu
# ============================================================================

[build-menu]
# Error output uses the compiler's arrow location. Geany reads file + line.
error_regex=^[ \t]*--> (.+):([0-9]+):[0-9]+$

FT_00_LB=_Check
FT_00_CM=@VITTE_EDITOR@ check "%d/%f"
FT_00_WD=@FILE_WD@

FT_01_LB=_Build
FT_01_CM=@VITTE_EDITOR@ build "%d/%f"
FT_01_WD=@FILE_WD@

FT_02_LB=_Run
FT_02_CM=@VITTE_EDITOR@ run "%d/%f"
FT_02_WD=@FILE_WD@

FT_03_LB=_Test
FT_03_CM=@VITTE_EDITOR@ test "%d/%f"
FT_03_WD=@FILE_WD@

FT_04_LB=_Format Write
FT_04_CM=@VITTE_EDITOR@ format-write "%d/%f"
FT_04_WD=@FILE_WD@

FT_05_LB=_Format Check
FT_05_CM=@VITTE_EDITOR@ format-check "%d/%f"
FT_05_WD=@FILE_WD@

FT_06_LB=_Lex
FT_06_CM=@VITTE_EDITOR@ lex "%d/%f"
FT_06_WD=@FILE_WD@

FT_07_LB=_Parse
FT_07_CM=@VITTE_EDITOR@ parse "%d/%f"
FT_07_WD=@FILE_WD@

FT_08_LB=_AST
FT_08_CM=@VITTE_EDITOR@ ast "%d/%f"
FT_08_WD=@FILE_WD@

FT_09_LB=_Current File Symbols
FT_09_CM=@VITTE_EDITOR@ symbols "%d/%f"
FT_09_WD=@FILE_WD@

FT_10_LB=_Project Check
FT_10_CM=@VITTE_EDITOR@ project-check "%p"
FT_10_WD=%p

FT_11_LB=_Project Test
FT_11_CM=@VITTE_EDITOR@ project-test "%p"
FT_11_WD=%p

FT_12_LB=_Project Format
FT_12_CM=@VITTE_EDITOR@ project-format "%p"
FT_12_WD=%p

FT_13_LB=_Workspace Symbols
FT_13_CM=@VITTE_EDITOR@ symbols "%p"
FT_13_WD=%p

FT_14_LB=_Workspace Tags
FT_14_CM=@VITTE_EDITOR@ tags "%p" --output "%p/tags"
FT_14_WD=%p

FT_15_LB=_Doctor
FT_15_CM=@VITTE_EDITOR@ doctor
FT_15_WD=%p

EX_00_LB=_Execute
EX_00_CM=@VITTE_EDITOR@ run "%d/%f"
EX_00_WD=%d
